<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#11142b" />
  <meta name="description" content="WEBLINE — a one-button momentum hook game." />
  <title>WEBLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <div id="game"></div>

    <header id="hud" class="hud is-hidden">
      <button id="backBtn" class="round-button" aria-label="Back to level select">‹</button>
      <div class="progress-wrap">
        <div class="level-numbers"><span id="levelCurrent">1</span><span id="levelNext">2</span></div>
        <div class="progress-track"><i id="progressBar"></i><b id="progressDot"></b></div>
      </div>
      <button id="restartBtn" class="round-button restart" aria-label="Restart level">↻</button>
    </header>

    <section id="home" class="screen active">
      <div class="hero-mark" aria-hidden="true"><span></span><i></i><b></b></div>
      <div class="eyebrow">ONE BUTTON. PURE MOMENTUM.</div>
      <h1>WEB<span>LINE</span></h1>
      <p>Hold to hook. Release to fly. Reach the line.</p>
      <button id="playBtn" class="primary-button">PLAY</button>
      <button id="levelsBtn" class="text-button">LEVELS</button>
      <div class="control-pill"><kbd>SPACE</kbd><span>HOLD / RELEASE</span></div>
      <div class="tap-hint">Touch anywhere on mobile</div>
    </section>

    <section id="levels" class="screen">
      <div class="sheet">
        <div class="sheet-head">
          <div><div class="eyebrow">COURSE SELECT</div><h2>18 LEVELS</h2></div>
          <button class="round-button" data-close>×</button>
        </div>
        <div id="levelGrid" class="level-grid"></div>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-card">
        <div id="resultEyebrow" class="eyebrow">LEVEL CLEARED</div>
        <h2 id="resultTitle">CLEAN SWING</h2>
        <div id="resultStars" class="stars">★★★</div>
        <div class="result-stats">
          <div><span>TIME</span><strong id="resultTime">0.00s</strong></div>
          <div><span>BEST</span><strong id="resultBest">0.00s</strong></div>
          <div><span>RESTARTS</span><strong id="resultDeaths">0</strong></div>
        </div>
        <button id="nextBtn" class="primary-button">NEXT</button>
        <button id="retryBtn" class="text-button">RUN AGAIN</button>
      </div>
    </section>

    <div id="startPrompt" class="start-prompt is-hidden">
      <strong>HOLD <kbd>SPACE</kbd></strong>
      <span>release at the right moment</span>
    </div>
    <div id="toast" class="toast"></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
